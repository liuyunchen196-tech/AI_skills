<!DOCTYPE html>
<html lang="__LANG__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__</title>
<style>
:root{
  --bg:#0f1115; --panel:#161a21; --panel2:#1c212a; --line:#2a313c;
  --fg:#e6e9ef; --fg2:#9aa4b2; --accent:#5b9cff; --accent-soft:#1e2c47;
  --ok:#3fb950; --warn:#d29922; --shadow:0 6px 24px rgba(0,0,0,.35);
}
html[data-theme="light"]{
  --bg:#f4f6f9; --panel:#ffffff; --panel2:#f7f9fc; --line:#e3e8ef;
  --fg:#1b2330; --fg2:#6b7684; --accent:#2563eb; --accent-soft:#e8f0ff;
  --shadow:0 4px 18px rgba(20,30,50,.10);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  font-size:14px;overflow:hidden}
.top{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--panel);
  border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-weight:600;font-size:15px;letter-spacing:.2px}
.brand small{display:block;font-weight:400;font-size:11px;color:var(--fg2);margin-top:1px}
.spacer{flex:1}
button,.sel,input[type=search]{background:var(--panel2);color:var(--fg);
  border:1px solid var(--line);border-radius:7px;padding:6px 10px;font-size:13px;
  font-family:inherit;cursor:pointer;transition:.15s}
button:hover{border-color:var(--accent);color:var(--accent)}
button:active{transform:translateY(1px)}
button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
input[type=search]{cursor:text;min-width:150px}
.sel{padding:6px 8px}
.main{display:flex;height:calc(100vh - 56px)}
#viewport{flex:1;overflow:hidden;position:relative;
  background:var(--bg);background-image:radial-gradient(circle at 1px 1px,var(--line) 1px,transparent 0);
  background-size:22px 22px;cursor:grab}
#viewport.drag{cursor:grabbing}
#stage{position:absolute;transform-origin:0 0;will-change:transform}
#stage svg{display:block;max-width:none;box-shadow:var(--shadow);border-radius:10px}
.side{width:288px;background:var(--panel);border-left:1px solid var(--line);
  padding:14px;overflow:auto}
.side h3{margin:0 0 8px;font-size:12px;letter-spacing:1px;color:var(--fg2);font-weight:600}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:9px;
  padding:11px 12px;margin-bottom:12px}
.card .t{font-weight:600;margin-bottom:5px;font-size:14px}
.card .d{color:var(--fg2);font-size:12.5px;line-height:1.65;white-space:pre-wrap}
.kv{display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0;color:var(--fg2)}
.kv b{color:var(--fg);font-weight:500}
.hint{color:var(--fg2);font-size:12px;line-height:1.8}
.hint kbd{background:var(--panel2);border:1px solid var(--line);border-bottom-width:2px;
  border-radius:4px;padding:1px 5px;font-size:11px;font-family:inherit}
.tag{display:inline-block;background:var(--accent-soft);color:var(--accent);
  border-radius:5px;padding:1px 7px;font-size:11px;margin:0 4px 4px 0}
.empty{color:var(--fg2);font-size:12.5px;line-height:1.7}
#zoom{position:absolute;left:14px;bottom:14px;background:var(--panel);
  border:1px solid var(--line);border-radius:8px;padding:3px;display:flex;gap:2px}
#zoom button{border:none;background:transparent;padding:4px 9px}
.bd-svg.dim .bd-node,.bd-svg.dim .bd-edge{opacity:.16;transition:opacity .18s}
.bd-svg.dim .bd-node.hl,.bd-svg.dim .bd-edge.hl{opacity:1}
.bd-node{cursor:pointer}
.bd-node.hl>g>rect,.bd-node.hl>g>polygon,.bd-node.hl>g>path,.bd-node.hl>g>circle{
  filter:drop-shadow(0 0 0 var(--accent))}
.bd-edge.hl .bd-edge-line{stroke-width:2.6}
.bd-node.found>g>rect,.bd-node.found>g>polygon{stroke:var(--accent);stroke-width:2.4}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
  background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:8px 16px;font-size:13px;box-shadow:var(--shadow);opacity:0;
  transition:.2s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body data-base="__BASE__">
<div class="top">
  <div class="brand">__TITLE__<small>__SUBTITLE__</small></div>
  <div class="spacer"></div>
  <input type="search" id="q" placeholder="搜索节点…">
  <select class="sel" id="views">__VIEW_OPTS__</select>
  <button id="btn-reach" title="选中节点后查看上下游">可达</button>
  <button id="btn-route" title="依次选两个节点，追溯路径">路由</button>
  <button id="btn-clear">清除</button>
  <button id="btn-theme">主题</button>
  <button id="btn-svg">SVG</button>
  <button id="btn-png">PNG</button>
  <button id="btn-card">分享卡</button>
</div>
<div class="main">
  <div id="viewport">
    <div id="stage">__SVG__</div>
    <div id="zoom">
      <button id="zo">−</button><button id="zr">重置</button><button id="zi">+</button>
    </div>
  </div>
  <aside class="side">
    <div id="detail">
      <h3>节点详情</h3>
      <div class="empty">点击图中任意节点查看信息；<br>点「可达」看上下游；<br>点「路由」后依次选两个节点追溯路径。</div>
    </div>
    <h3>图纸信息</h3>
    <div class="card">
      <div class="kv"><span>图型</span><b>__DIAGRAM_TYPE__</b></div>
      <div class="kv"><span>风格</span><b>__STYLE_ID__</b></div>
      <div class="kv"><span>节点 / 连线</span><b>__NODE_COUNT__ / __EDGE_COUNT__</b></div>
    </div>
    <h3>快捷键</h3>
    <div class="hint">
      <kbd>/</kbd> 搜索　<kbd>R</kbd> 路由　<kbd>F</kbd> 可达<br>
      <kbd>Esc</kbd> 清除　<kbd>+</kbd> <kbd>−</kbd> <kbd>0</kbd> 缩放<br>
      拖拽平移，滚轮缩放
    </div>
  </aside>
</div>
<div class="toast" id="toast"></div>
<script>
(function(){
  var DATA = __DATA__;
  var svg = document.getElementById('bd-svg');
  var stage = document.getElementById('stage');
  var vp = document.getElementById('viewport');
  var CW = __CANVAS_W__, CH = __CANVAS_H__;
  var scale = 1, tx = 0, ty = 0, selected = null, routeStart = null, mode = null;

  /* ---------- 主题 ---------- */
  function setTheme(t){
    document.documentElement.setAttribute('data-theme', t);
    try{ localStorage.setItem('bd-theme', t); }catch(e){}
  }
  (function(){
    var saved=null; try{ saved = localStorage.getItem('bd-theme'); }catch(e){}
    setTheme(saved || (document.body.dataset.base === 'dark' ? 'dark' : 'light'));
  })();
  document.getElementById('btn-theme').onclick = function(){
    setTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  };

  /* ---------- 缩放平移 ---------- */
  function apply(){ stage.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + scale + ')'; }
  function fit(){
    var pad = 32;
    var w = vp.clientWidth - pad*2, h = vp.clientHeight - pad*2;
    scale = Math.min(w/CW, h/CH, 1.6);
    if(scale > 1) scale = 1;
    scale = Math.max(scale, 0.18);
    tx = (vp.clientWidth - CW*scale)/2;
    ty = (vp.clientHeight - CH*scale)/2;
    apply();
  }
  function zoomAt(cx, cy, factor){
    var ns = Math.min(3.2, Math.max(0.15, scale*factor));
    tx = cx - (cx - tx) * (ns/scale);
    ty = cy - (cy - ty) * (ns/scale);
    scale = ns; apply();
  }
  vp.addEventListener('wheel', function(e){
    e.preventDefault();
    var r = vp.getBoundingClientRect();
    zoomAt(e.clientX - r.left, e.clientY - r.top, e.deltaY < 0 ? 1.12 : 1/1.12);
  }, {passive:false});
  var dragging=false, sx=0, sy=0;
  vp.addEventListener('mousedown', function(e){
    if(e.target.closest('.bd-node')) return;
    dragging=true; sx=e.clientX-tx; sy=e.clientY-ty; vp.classList.add('drag');
  });
  window.addEventListener('mousemove', function(e){
    if(!dragging) return; tx=e.clientX-sx; ty=e.clientY-sy; apply();
  });
  window.addEventListener('mouseup', function(){ dragging=false; vp.classList.remove('drag'); });
  document.getElementById('zi').onclick=function(){ zoomAt(vp.clientWidth/2, vp.clientHeight/2, 1.2); };
  document.getElementById('zo').onclick=function(){ zoomAt(vp.clientWidth/2, vp.clientHeight/2, 1/1.2); };
  document.getElementById('zr').onclick=fit;
  window.addEventListener('resize', fit);
  fit();

  /* ---------- 图数据索引 ---------- */
  var byId = {}, out = {}, inn = {};
  DATA.nodes.forEach(function(n){ byId[n.id]=n; out[n.id]=[]; inn[n.id]=[]; });
  DATA.edges.forEach(function(e){
    if(out[e.source] && inn[e.target]){ out[e.source].push(e.target); inn[e.target].push(e.source); }
  });
  function nodeEl(id){ return svg.querySelector('.bd-node[data-id="'+cssEsc(id)+'"]'); }
  function edgeEls(s,t){
    var r=[];
    DATA.edges.forEach(function(e){
      if((!s||e.source===s)&&(!t||e.target===t)){
        var el=svg.querySelector('.bd-edge[data-id="'+cssEsc(e.id)+'"]'); if(el) r.push(el);
      }
    });
    return r;
  }
  function cssEsc(v){ return String(v).replace(/["\\]/g,'\\$&'); }

  function clearHL(){
    svg.classList.remove('dim');
    Array.prototype.forEach.call(svg.querySelectorAll('.hl'), function(el){ el.classList.remove('hl'); });
    Array.prototype.forEach.call(svg.querySelectorAll('.found'), function(el){ el.classList.remove('found'); });
  }
  function hlNodes(ids){
    ids.forEach(function(id){ var el=nodeEl(id); if(el) el.classList.add('hl'); });
  }
  function hlEdgePair(ids){
    ids.forEach(function(id){
      var el=svg.querySelector('.bd-edge[data-id="'+cssEsc(id)+'"]'); if(el) el.classList.add('hl');
    });
  }
  function dim(on){ if(on) svg.classList.add('dim'); else svg.classList.remove('dim'); }

  /* ---------- 可达性（忠实：只复用图中已有节点与关系） ---------- */
  function reach(start, dir){
    var seen={}, stack=[start], order=[];
    var adj = dir==='down' ? out : inn;
    while(stack.length){
      var cur=stack.pop();
      (adj[cur]||[]).forEach(function(nx){
        if(!seen[nx]){ seen[nx]=true; order.push(nx); stack.push(nx); }
      });
    }
    return order;
  }

  /* ---------- 路由探测（BFS，只走图中真实存在的关系） ---------- */
  function findRoute(a,b){
    var prev={}, q=[a], seen={}; seen[a]=true;
    while(q.length){
      var cur=q.shift();
      if(cur===b){
        var path=[cur], edges=[];
        while(prev[cur]){ edges.unshift(prev[cur].e); cur=prev[cur].n; path.unshift(cur); }
        return {path:path, edges:edges};
      }
      (out[cur]||[]).forEach(function(nx){
        if(seen[nx]) return; seen[nx]=true;
        var e=(DATA.edges.filter(function(x){return x.source===cur&&x.target===nx;})[0]||{}).id;
        prev[nx]={n:cur,e:e}; q.push(nx);
      });
    }
    return null;
  }

  /* ---------- 详情面板 ---------- */
  function showDetail(n, extra){
    var box=document.getElementById('detail');
    if(!n){ box.innerHTML='<h3>节点详情</h3><div class="empty">点击图中任意节点查看信息。</div>'; return; }
    var h='<h3>节点详情</h3><div class="card"><div class="t">'+esc(n.label)+'</div>';
    if(n.desc) h+='<div class="d">'+esc(n.desc)+'</div>';
    if(n.tech) h+='<div class="d" style="margin-top:6px">技术栈：'+esc(n.tech)+'</div>';
    h+='<div style="margin-top:8px"><span class="tag">'+esc(n.type)+'</span></div></div>';
    if(extra) h+=extra;
    box.innerHTML=h;
  }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  /* ---------- 交互 ---------- */
  svg.addEventListener('click', function(e){
    var g = e.target.closest('.bd-node');
    if(!g) return;
    var id = g.getAttribute('data-id');
    selected = id;
    if(mode==='route'){
      if(!routeStart){ routeStart=id; toast('已选起点「'+byId[id].label+'」，请选择终点'); return; }
      var res = findRoute(routeStart, id);
      clearHL(); dim(true);
      if(res){
        hlNodes(res.path); hlEdgePair(res.edges);
        showDetail(byId[id], '<h3>路由追溯</h3><div class="card"><div class="d">'
          + res.path.map(function(p){return byId[p].label;}).join(' → ')
          + '\n共 ' + (res.path.length-1) + ' 跳</div></div>');
        toast('找到路径，共 ' + (res.path.length-1) + ' 跳');
      }else{
        hlNodes([routeStart,id]);
        showDetail(byId[id], '<h3>路由追溯</h3><div class="card"><div class="d">图中不存在从「'
          + byId[routeStart].label + '」到「' + byId[id].label + '」的有向路径。</div></div>');
        toast('图中不存在该有向路径');
      }
      routeStart=null; mode=null; document.getElementById('btn-route').classList.remove('on');
      return;
    }
    clearHL(); dim(true);
    hlNodes([id]);
    edgeEls(id,null).forEach(function(el){ el.classList.add('hl'); });
    edgeEls(null,id).forEach(function(el){ el.classList.add('hl'); });
    showDetail(byId[id]);
  });

  document.getElementById('btn-reach').onclick=function(){
    if(!selected){ toast('请先点击一个节点'); return; }
    var up=reach(selected,'up'), down=reach(selected,'down');
    clearHL(); dim(true);
    hlNodes([selected].concat(up).concat(down));
    [].concat(edgeEls(selected,null)).concat(edgeEls(null,selected)).forEach(function(el){
      el.classList.add('hl'); });
    var txt='<h3>可达性分析</h3><div class="card"><div class="d">';
    txt+='<b>上游 '+up.length+' 个</b>：'+(up.map(function(i){return byId[i].label;}).join('、')||'无')+'\n';
    txt+='<b>下游 '+down.length+' 个</b>：'+(down.map(function(i){return byId[i].label;}).join('、')||'无');
    txt+='</div><div class="d" style="margin-top:8px;opacity:.8">仅基于图中已绘制的关系，不推断运行时影响。</div></div>';
    showDetail(byId[selected], txt);
  };
  document.getElementById('btn-route').onclick=function(){
    mode = mode==='route' ? null : 'route'; routeStart=null;
    this.classList.toggle('on', mode==='route');
    toast(mode ? '请点击起点节点' : '已退出路由模式');
  };
  document.getElementById('btn-clear').onclick=function(){
    clearHL(); selected=null; routeStart=null; mode=null;
    document.getElementById('btn-route').classList.remove('on');
    document.getElementById('q').value='';
    showDetail(null);
  };

  /* ---------- 搜索 ---------- */
  document.getElementById('q').addEventListener('input', function(){
    var v=this.value.trim().toLowerCase();
    Array.prototype.forEach.call(svg.querySelectorAll('.found'), function(el){ el.classList.remove('found'); });
    if(!v){ svg.classList.remove('dim'); return; }
    var hit=0;
    DATA.nodes.forEach(function(n){
      if((n.label||'').toLowerCase().indexOf(v)>=0 || (n.desc||'').toLowerCase().indexOf(v)>=0){
        var el=nodeEl(n.id); if(el){ el.classList.add('found'); hit++; }
      }
    });
    svg.classList.toggle('dim', hit>0);
    if(hit>0){ Array.prototype.forEach.call(svg.querySelectorAll('.found'), function(el){ el.classList.add('hl'); }); }
  });

  /* ---------- 语义视图 ---------- */
  var vs=document.getElementById('views');
  if(vs && vs.options.length>1){
    vs.onchange=function(){
      var id=this.value;
      if(!id){ clearHL(); return; }
      var v=(DATA.views||[]).filter(function(x){return x.id===id;})[0];
      if(!v) return;
      clearHL(); dim(true); hlNodes(v.nodes);
      toast('已切换到视图：'+v.label);
    };
  } else if(vs){ vs.style.display='none'; }

  /* ---------- 导出 ---------- */
  function svgText(){
    var c = svg.cloneNode(true);
    c.setAttribute('xmlns','http://www.w3.org/2000/svg');
    c.removeAttribute('id');
    c.setAttribute('width', CW); c.setAttribute('height', CH);
    return '<?xml version="1.0" encoding="UTF-8"?>\n' + new XMLSerializer().serializeToString(c);
  }
  function download(blob, name){
    var a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download=name;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 300);
  }
  function raster(w, h, name, pad){
    var txt=svgText();
    var img=new Image();
    var blob=new Blob([txt],{type:'image/svg+xml;charset=utf-8'});
    var url=URL.createObjectURL(blob);
    img.onload=function(){
      var cv=document.createElement('canvas');
      cv.width=w; cv.height=h;
      var ctx=cv.getContext('2d');
      ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim()||'#fff';
      ctx.fillRect(0,0,w,h);
      var sc=Math.min((w-pad*2)/CW,(h-pad*2)/CH);
      var dw=CW*sc, dh=CH*sc;
      ctx.drawImage(img,(w-dw)/2,(h-dh)/2,dw,dh);
      cv.toBlob(function(b){ download(b,name); URL.revokeObjectURL(url); });
    };
    img.onerror=function(){ URL.revokeObjectURL(url); toast('导出失败：SVG 无法光栅化'); };
    img.src=url;
  }
  document.getElementById('btn-svg').onclick=function(){
    download(new Blob([svgText()],{type:'image/svg+xml;charset=utf-8'}), 'diagram.svg');
    toast('已导出 SVG');
  };
  document.getElementById('btn-png').onclick=function(){
    raster(Math.round(CW*2), Math.round(CH*2), 'diagram.png', 0);
    toast('已导出 PNG（2×）');
  };
  document.getElementById('btn-card').onclick=function(){
    raster(1200, 630, 'share-card.png', 48);
    toast('已导出 1200×630 分享卡');
  };

  /* ---------- 快捷键 ---------- */
  var toastEl=document.getElementById('toast'), toastT=null;
  function toast(msg){
    toastEl.textContent=msg; toastEl.classList.add('show');
    clearTimeout(toastT); toastT=setTimeout(function(){ toastEl.classList.remove('show'); }, 1900);
  }
  window.addEventListener('keydown', function(e){
    if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT'){
      if(e.key==='Escape'){ e.target.blur(); }
      return;
    }
    if(e.key==='/'){ e.preventDefault(); document.getElementById('q').focus(); }
    else if(e.key==='r'||e.key==='R'){ document.getElementById('btn-route').click(); }
    else if(e.key==='f'||e.key==='F'){ document.getElementById('btn-reach').click(); }
    else if(e.key==='Escape'){ document.getElementById('btn-clear').click(); }
    else if(e.key==='+'||e.key==='='){ document.getElementById('zi').click(); }
    else if(e.key==='-'||e.key==='_'){ document.getElementById('zo').click(); }
    else if(e.key==='0'){ fit(); }
  });
})();
</script>
</body>
</html>
